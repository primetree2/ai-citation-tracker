name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  source:
    name: Check Pages publishing mode
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      actions_mode: ${{ steps.mode.outputs.actions_mode }}
    steps:
      - id: mode
        name: Detect configured Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null); then
            echo 'actions_mode=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Pages is not enabled or its settings cannot be read. Open Settings > Pages and choose GitHub Actions, then run this workflow again. Branch deployment is also supported; see docs/DEPLOYMENT.md.'
          elif [ "$mode" = 'workflow' ]; then
            echo 'actions_mode=true' >> "$GITHUB_OUTPUT"
          elif [ "$mode" = 'legacy' ]; then
            echo 'actions_mode=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Pages is configured for branch deployment. GitHub handles publishing from that configured branch/folder; this custom deployment is intentionally skipped. For this project use main and /(root), or switch Source to GitHub Actions.'
          else
            echo 'actions_mode=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Unrecognized Pages source. Check Settings > Pages and docs/DEPLOYMENT.md. No deployment was attempted.'
          fi
  deploy:
    name: Publish static site
    needs: source
    if: needs.source.outputs.actions_mode == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
